[package]
name = "seamless-image-edit"
version = "0.1.0"
description = "Local seamless texture and tile image editor"
authors = ["Neko Legends"]
license = "MIT"
repository = "https://github.com/neko-legends/SeamlessImageEdit"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "seamless_image_edit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-opener = "2.5.0"
texture-synthesis = "0.8.2"

